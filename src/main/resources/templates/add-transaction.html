<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Transaction - Fraud Watch</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <div class="nav-container">
        <a class="brand" th:href="@{/}">Fraud<span>Watch</span></a>
        <nav>
            <ul>
                <li><a th:href="@{/dashboard}">Dashboard</a></li>
                <li><a th:href="@{/transactions}">Transactions</a></li>
                <li><a th:href="@{/flagged}">Flagged Transactions</a></li>
                <li><a th:href="@{/rules}">Rules</a></li>
                <li><a class="nav-btn active" th:href="@{/transactions/new}">+ New Transaction</a></li>
            </ul>
        </nav>
    </div>
</header>

<main>
    <div class="page-header">
        <h1 class="page-title">Create Transaction</h1>
        <a class="btn btn-secondary" th:href="@{/transactions}">Back to Transactions</a>
    </div>

    <!-- Alert for general errors -->
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="content-card" style="max-width: 600px; margin: 0 auto;">
        <h2>Transaction Details</h2>
        <form th:action="@{/transactions}" th:object="${transaction}" method="post">
            <div class="form-group">
                <label for="amount">Amount *</label>
                <input type="number" step="0.01" id="amount" th:field="*{amount}" class="form-control" placeholder="e.g. 5000.00" required>
                <div class="field-error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
            </div>

            <div class="form-group">
                <label for="senderAccount">Sender Account *</label>
                <input type="text" id="senderAccount" th:field="*{senderAccount}" class="form-control" placeholder="e.g. ACC1001" required>
                <div class="field-error" th:if="${#fields.hasErrors('senderAccount')}" th:errors="*{senderAccount}"></div>
            </div>

            <div class="form-group">
                <label for="receiverAccount">Receiver Account *</label>
                <input type="text" id="receiverAccount" th:field="*{receiverAccount}" class="form-control" placeholder="e.g. ACC2002" required>
                <div class="field-error" th:if="${#fields.hasErrors('receiverAccount')}" th:errors="*{receiverAccount}"></div>
            </div>

            <div class="form-group">
                <label for="timestamp">Timestamp (Optional)</label>
                <input type="datetime-local" id="timestamp" th:field="*{timestamp}" class="form-control">
                <div class="form-text">Leave blank to use the current system date and time.</div>
                <div class="field-error" th:if="${#fields.hasErrors('timestamp')}" th:errors="*{timestamp}"></div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Create Transaction</button>
                <a th:href="@{/transactions}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer>
    <p>Fraud Watch — Basic Transaction Anomaly Flagging System</p>
</footer>
</body>
</html>
